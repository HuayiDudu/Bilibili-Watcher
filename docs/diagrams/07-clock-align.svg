l="#A80036" points="242,685.0732,246,695.0732,250,685.0732,246,689.0732" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="86" x2="86" y1="730.9111" y2="764.749"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="86" x2="154" y1="764.749" y2="764.749"/><polygon fill="#A80036" points="144,760.749,154,764.749,144,768.749,148,764.749" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="246" x2="246" y1="746.749" y2="764.749"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="246" x2="178" y1="764.749" y2="764.749"/><polygon fill="#A80036" points="188,760.749,178,764.749,188,768.749,184,764.749" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="166" x2="166" y1="533.8882" y2="661.0732"/><polygon fill="#A80036" points="162,651.0732,166,661.0732,170,651.0732,166,655.0732" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="166" x2="166" y1="776.749" y2="796.749"/><polygon fill="#A80036" points="162,786.749,166,796.749,170,786.749,166,790.749" style="stroke: #A80036; stroke-width: 1.0;"/></g></svg>